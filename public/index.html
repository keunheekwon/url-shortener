<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>URL Shortener</title>
    <style>
      body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        background: linear-gradient(120deg, #a1c4fd 0%, #c2e9fb 100%);
        padding: 20px;
      }

      .container {
        background-color: rgba(255, 255, 255, 0.95);
        padding: 3rem;
        border-radius: 20px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
        text-align: center;
        max-width: 500px;
        width: 100%;
        backdrop-filter: blur(10px);
      }

      h2 {
        color: #1a237e;
        margin-bottom: 2rem;
        font-weight: 700;
        font-size: 2.2rem;
        letter-spacing: -0.5px;
      }

      input {
        width: 100%;
        padding: 14px 16px;
        margin: 12px 0;
        border-radius: 12px;
        border: 2px solid #e3e8f0;
        transition: all 0.3s ease;
        font-size: 1rem;
        box-sizing: border-box;
        background-color: #f8fafc;
      }

      input:focus {
        outline: none;
        border-color: #3b82f6;
        box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        background-color: #fff;
      }

      button {
        width: 100%;
        padding: 14px;
        margin: 20px 0;
        border-radius: 12px;
        border: none;
        background: linear-gradient(45deg, #3b82f6, #60a5fa);
        color: white;
        font-size: 1.1rem;
        font-weight: 600;
        cursor: pointer;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }

      button:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 15px rgba(59, 130, 246, 0.3);
      }

      button:active {
        transform: translateY(0);
      }

      #shortenedUrl {
        margin-top: 2rem;
        padding: 1.5rem;
        border-radius: 12px;
        background-color: #f8fafc;
        border: 2px solid #e3e8f0;
      }

      #shortenedUrl p {
        color: #4b5563;
        margin-bottom: 10px;
        font-size: 0.95rem;
      }

      #shortenedUrl a {
        color: #3b82f6;
        text-decoration: none;
        font-weight: 600;
        font-size: 1.1rem;
        padding: 8px 16px;
        background-color: #eff6ff;
        border-radius: 8px;
        display: inline-block;
        transition: all 0.2s ease;
      }

      #shortenedUrl a:hover {
        background-color: #dbeafe;
        transform: translateY(-1px);
      }

      @media (max-width: 480px) {
        .container {
          padding: 2rem;
        }
        
        h2 {
          font-size: 1.8rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>URL Shortener</h2>
      <form id="urlForm">
        <input
          type="url"
          id="originalUrl"
          placeholder="Enter URL to shorten"
          required
        />
        <input
          type="text"
          id="customUrl"
          placeholder="Enter custom shortened URL (optional)"
        />
        <button type="submit">Shorten URL</button>
      </form>
      <div id="shortenedUrl"></div>
    </div>

    <script>
      document
        .getElementById("urlForm")
        .addEventListener("submit", async function (event) {
          event.preventDefault();

          const originalUrl = document.getElementById("originalUrl").value;
          const customUrl = document.getElementById("customUrl").value;

          try {
            const response = await fetch("/shorten", {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
              },
              body: JSON.stringify({ originalUrl, customUrl }),
            });

            const data = await response.json();

            if (data.shortenedUrl) {
              document.getElementById("shortenedUrl").innerHTML = `
            <p>Your shortened URL is:</p>
            <a href="${data.shortenedUrl}" target="_blank">${data.shortenedUrl}</a>
          `;
            } else {
              document.getElementById(
                "shortenedUrl"
              ).innerHTML = `<p>Error: ${data.error}</p>`;
            }
          } catch (error) {
            document.getElementById(
              "shortenedUrl"
            ).innerHTML = `<p>Error: ${error.message}</p>`;
          }
        });
    </script>
  </body>
</html>
