<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>URL Shortener</title>
    <style>
      body {
        font-family: "Segoe UI", -apple-system, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      }
      .container {
        background-color: white;
        padding: 2.5rem;
        border-radius: 16px;
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.08);
        text-align: center;
        max-width: 450px;
        width: 90%;
      }
      h2 {
        color: #2c3e50;
        margin-bottom: 1.5rem;
        font-weight: 600;
      }
      input {
        width: 100%;
        padding: 12px;
        margin: 8px 0;
        border-radius: 8px;
        border: 2px solid #e0e0e0;
        transition: border-color 0.3s ease;
        font-size: 1rem;
        box-sizing: border-box;
      }
      input:focus {
        outline: none;
        border-color: #3498db;
      }
      button {
        width: 100%;
        padding: 12px;
        margin: 16px 0;
        border-radius: 8px;
        border: none;
        background: #3498db;
        color: white;
        font-size: 1rem;
        font-weight: 500;
        cursor: pointer;
        transition: background-color 0.3s ease;
      }
      button:hover {
        background: #2980b9;
      }
      #shortenedUrl {
        margin-top: 1.5rem;
        padding: 1rem;
        border-radius: 8px;
        background-color: #f8f9fa;
      }
      #shortenedUrl a {
        color: #3498db;
        text-decoration: none;
        font-weight: 500;
      }
      #shortenedUrl a:hover {
        text-decoration: underline;
      }
      .login-form {
        margin-bottom: 1.5rem;
        padding-bottom: 1.5rem;
        border-bottom: 2px solid #f0f0f0;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>URL Shortener</h2>
      <form id="urlForm">
        <input
          type="url"
          id="originalUrl"
          placeholder="Enter URL to shorten"
          required
        />
        <input
          type="text"
          id="customUrl"
          placeholder="Enter custom shortened URL (optional)"
        />
        <button type="submit">Shorten URL</button>
      </form>
      <div id="shortenedUrl"></div>
    </div>

    <script>
      document
        .getElementById("urlForm")
        .addEventListener("submit", async function (event) {
          event.preventDefault();

          const originalUrl = document.getElementById("originalUrl").value;
          const customUrl = document.getElementById("customUrl").value;

          try {
            const response = await fetch("/shorten", {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
              },
              body: JSON.stringify({ originalUrl, customUrl }),
            });

            const data = await response.json();

            if (data.shortenedUrl) {
              document.getElementById("shortenedUrl").innerHTML = `
            <p>Your shortened URL is:</p>
            <a href="${data.shortenedUrl}" target="_blank">${data.shortenedUrl}</a>
          `;
            } else {
              document.getElementById(
                "shortenedUrl"
              ).innerHTML = `<p>Error: ${data.error}</p>`;
            }
          } catch (error) {
            document.getElementById(
              "shortenedUrl"
            ).innerHTML = `<p>Error: ${error.message}</p>`;
          }
        });
    </script>
  </body>
</html>
