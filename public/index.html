<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>URL Shortener</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background-color: #f0f0f0;
    }
    .container {
      background-color: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      text-align: center;
      max-width: 400px;
      width: 100%;
    }
    input, button {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border-radius: 4px;
      border: 1px solid #ccc;
    }
    #shortenedUrl {
      margin-top: 10px;
      color: #4CAF50;
    }
    .login-form {
      margin-bottom: 20px;
      padding-bottom: 20px;
      border-bottom: 1px solid #ccc;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>URL Shortener</h2>
    <div class="login-form">
      <input type="text" id="username" placeholder="Username" />
      <input type="password" id="password" placeholder="Password" />
      <button onclick="login()">Login</button>
    </div>
    <form id="urlForm">
      <input type="url" id="originalUrl" placeholder="Enter URL to shorten" required />
      <input type="text" id="customUrl" placeholder="Enter custom shortened URL (optional)" />
      <button type="submit">Shorten URL</button>
    </form>
    <div id="shortenedUrl"></div>
  </div>

  <script>
    let currentUser = null;

    function login() {
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      currentUser = { username, password };
      alert('Logged in successfully!');
    }

    document.getElementById('urlForm').addEventListener('submit', async function(event) {
      event.preventDefault();

      if (!currentUser) {
        document.getElementById('shortenedUrl').innerHTML = '<p>Please login first</p>';
        return;
      }

      const originalUrl = document.getElementById('originalUrl').value;
      const customUrl = document.getElementById('customUrl').value;

      try {
        const response = await fetch('/shorten', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'username': currentUser.username,
            'password': currentUser.password
          },
          body: JSON.stringify({ originalUrl, customUrl }),
        });

        const data = await response.json();

        if (data.shortenedUrl) {
          document.getElementById('shortenedUrl').innerHTML = `
            <p>Your shortened URL is:</p>
            <a href="${data.shortenedUrl}" target="_blank">${data.shortenedUrl}</a>
          `;
        } else {
          document.getElementById('shortenedUrl').innerHTML = `<p>Error: ${data.error}</p>`;
        }
      } catch (error) {
        document.getElementById('shortenedUrl').innerHTML = `<p>Error: ${error.message}</p>`;
      }
    });
  </script>
</body>
</html>
